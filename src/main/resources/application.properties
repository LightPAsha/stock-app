server.port=8080

# ЛОКАЛЬНИЙ режим: програма доступна лише на самому Raspberry Pi, у мережу нічого не відкрито.
# Щоб заходити ще й з телефонів у локальній мережі — змініть на 0.0.0.0
server.address=127.0.0.1

# Дані — в домашній папці користувача: /home/<ім'я>/StockApp/
stock.home=${user.home}/StockApp
spring.datasource.url=jdbc:h2:file:${stock.home}/data/stock;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Лог у файл (програма запускається без терміналу, помилки видно тут)
logging.file.name=${stock.home}/stock.log
logging.logback.rollingpolicy.max-history=7

# Економимо ресурси Raspberry Pi
spring.datasource.hikari.maximum-pool-size=4
server.tomcat.threads.max=20
spring.main.banner-mode=off

# Імпорт таблиць
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Автовихід після 30 хв без дій (сенсорний екран на складі — спільний)
server.servlet.session.timeout=30m

# Interface language: English (validation messages too, whatever the system locale)
spring.web.locale=en
spring.web.locale-resolver=fixed

# Вхід за паролем (адмін / користувачі). true — екран входу; false — програма відкривається одразу, повний доступ.
stock.login.enabled=true

# Вікно завжди перевіряє сторінку на сервері — після оновлення не лишається стара версія
spring.web.resources.cache.cachecontrol.no-cache=true
